services:
  db:
    image: postgres:18-alpine
    container_name: kotan-db
    # restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      TZ: UTC
      LANG: en_CA.UTF-8
      LC_ALL: en_CA.UTF-8
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kotan-network
  
  backend:
    build: ./backend
    container_name: kotan-backend
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    # restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./backend:/app
    env_file:
      - .env
    environment:
      TZ: UTC
      LANG: en_CA.UTF-8
      LC_ALL: en_CA.UTF-8
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connection_limit=20&pool_timeout=10
    networks:
      - kotan-network

  frontend:
    build: ./frontend
    container_name: kotan-frontend
    command: sh -c "npm run start"
    # restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    env_file:
      - .env
    environment:
      TZ: UTC
      LANG: en_CA.UTF-8
      LC_ALL: en_CA.UTF-8
    networks:
      - kotan-network

volumes:
  postgres_data:

networks:
  kotan-network:
    name: kotan-network
    driver: bridge
